# Render Blueprint: in the Render dashboard choose New > Blueprint and select this repository.
# It creates the PostgreSQL database and the web service; set APP_URL after the first deploy.
databases:
  - name: my-library-db
    databaseName: library
    plan: free

services:
  - type: web
    name: my-library
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-library-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PROXY_COUNT          # Render terminates TLS in one proxy in front of the app
        value: "1"
      - key: APP_URL
        sync: false          # e.g. https://my-library.onrender.com
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
